# Prometheus config for the Prometheus-and-Grafana-only stack (docker-compose v1, host networking
# on Linux). It scrapes the SDK endpoint of the first Worker on 127.0.0.1:9464, the dev server
# endpoint on 127.0.0.1:9465, and a second Worker's SDK endpoint on 127.0.0.1:9466, so the
# dashboard shows both sides of a frozen event loop and one line per Worker.
# The third target reads as down whenever no second Worker runs; that is expected.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: temporal
    static_configs:
      - targets:
          - 127.0.0.1:9464
          - 127.0.0.1:9465
          - 127.0.0.1:9466
