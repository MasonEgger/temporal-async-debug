name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync dependencies
        run: uv sync

      - name: Run the local gate
        run: just check

      - name: Audit dependencies
        run: uv run pip-audit
